<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brass Pulse KFK</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #d7b75a;
      --bg: #111111;
      --fg: #f7f4ec;
      --muted: #bbb4a6;
      --panel: #1b1b1b;
      --border: #3a3424;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
      background: var(--bg);
      color: var(--fg);
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      color: var(--fg);
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    nav a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--panel);
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Brass Pulse KFK</h1>
    <p>A focused metronome for practicing irregular measures, mixed meters, loop ranges, count-ins, and custom rhythm groupings.</p>
    <nav aria-label="App pages">
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
